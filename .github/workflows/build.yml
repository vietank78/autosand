
name: Build Fabric Mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build JAR
        run: gradle build --no-daemon

      - name: Obfuscate JAR (ProGuard)
        run: gradle obfuscate --no-daemon --info

      - name: Upload JAR (bản thường)
        uses: actions/upload-artifact@v4
        with:
          name: AutoSandNew-JAR
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload JAR (bản đã obfuscate)
        uses: actions/upload-artifact@v4
        with:
          name: AutoSandNew-JAR-obf
          path: build/libs/*-obf.jar
          if-no-files-found: error
