plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
    id 'com.guardsquare.proguard' version '7.5.0'
}

version = '1.0.0'
group = 'autosand'

base {
    archivesName = 'AutoSandNew'
}

// Jar Baritone (bản Fabric đầy đủ) nằm trong libs/. Đổi tên ở đây nếu file khác tên.
def baritoneJarName = 'baritone-api-fabric-1.17.0.jar'
def baritoneJar = file("libs/${baritoneJarName}")
if (!baritoneJar.exists()) {
    throw new GradleException("Thiếu file libs/${baritoneJarName}. Hãy commit jar Baritone vào thư mục libs/ rồi build lại.")
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.18.1'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.1+1.21.11'

    // Chỉ để biên dịch BaritoneBridge
    modCompileOnly files(baritoneJar)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

// Nhúng Baritone vào trong jar của AutoSand dưới dạng mod lồng (jar-in-jar).
// fabric.mod.json phải khai báo đường dẫn này trong mục "jars".
tasks.named('jar') {
    from(baritoneJar) {
        into 'META-INF/jars'
        rename { 'baritone.jar' }
    }
}

// ===================== PROGUARD — chạy SAU remapJar, trên jar đã remap sang Mojang mappings =====================
import proguard.gradle.ProGuardTask

task obfuscate(type: ProGuardTask) {
    dependsOn remapJar
    injars  remapJar.archiveFile.get().asFile
    outjars layout.buildDirectory.file("libs/${base.archivesName.get()}-${version}-obf.jar").get().asFile

    // Toàn bộ classpath biên dịch (Minecraft/Fabric API/Baritone) Loom đã remap sẵn — dùng làm libraryjars,
    // KHÔNG gộp vào jar, chỉ để ProGuard phân tích tham chiếu bên ngoài.
    libraryjars sourceSets.main.compileClasspath

    // Module JDK 21 (bắt buộc với java.* API như HttpClient dùng trong License)
    libraryjars "${System.getProperty('java.home')}/jmods/java.base.jmod", jarfilter: '!**.jar', filter: '!module-info.class'
    libraryjars "${System.getProperty('java.home')}/jmods/java.net.http.jmod", jarfilter: '!**.jar', filter: '!module-info.class'

    configuration 'proguard-rules.pro'
}

// obfuscate KHÔNG tự chạy mỗi lần `build` — bật dòng dưới nếu muốn build luôn kèm obfuscate;
// để comment lại nếu muốn chạy tay bằng `./gradlew obfuscate` cho đỡ chậm lúc đang code.
// build.dependsOn obfuscate
