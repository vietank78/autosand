plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
}

version = '1.0.0'
group = 'autosand'

base {
    archivesName = 'AutoSandNew'
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.18.1'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.1+1.21.11'

    // Baritone: cần để biên dịch BaritoneBridge (sửa lỗi "package baritone.api does not exist")
    modCompileOnly files('libs/baritone-1.17.0.jar')
    // Đóng gói Baritone như một mod lồng trong jar (Loom tự ghi vào fabric.mod.json)
    include files('libs/baritone-1.17.0.jar')
    // Dùng khi chạy thử runClient
    modLocalRuntime files('libs/baritone-1.17.0.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
