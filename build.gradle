plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
}

version = '1.0.0'
group = 'autosand'

base {
    archivesName = 'AutoSandNew'
}

// Tên jar Baritone đang nằm trong thư mục libs/ của repo. Đổi ở đây nếu tên file khác.
def baritoneJarName = 'baritone-api-fabric-1.17.0.jar'
def baritoneJar = file("libs/${baritoneJarName}")
if (!baritoneJar.exists()) {
    throw new GradleException("Thiếu file libs/${baritoneJarName}. Hãy commit jar Baritone vào thư mục libs/ (đúng tên này) rồi build lại.")
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.18.1'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.1+1.21.11'

    // Biên dịch BaritoneBridge
    modCompileOnly files(baritoneJar)
    // Đóng gói Baritone lồng trong jar (Loom ghi vào fabric.mod.json)
    include files(baritoneJar)
    // Chạy thử runClient
    modLocalRuntime files(baritoneJar)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
